---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kmortem-manager
  namespace: kmortem
  labels:
    app: kmortem
    control-plane: manager
spec:
  replicas: 1
  selector:
    matchLabels:
      control-plane: manager
  template:
    metadata:
      labels:
        app: kmortem
        control-plane: manager
    spec:
      serviceAccountName: kmortem-manager
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
      containers:
      - name: manager
        image: kmortem:latest
        imagePullPolicy: IfNotPresent
        args:
        - --leader-elect=true
        - --leader-election-namespace=kmortem
        - --metrics-bind-address=:8080
        - --health-probe-bind-address=:8081
        env:
        - name: KMORTEM_RETENTION_TTL
          value: "720h"
        ports:
        - containerPort: 8080
          name: metrics
          protocol: TCP
        - containerPort: 8081
          name: health
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          limits:
            cpu: 500m
            memory: 128Mi
          requests:
            cpu: 10m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
