---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "kmortem.fullname" . }}-rolebinding
  labels:
    {{- include "kmortem.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "kmortem.fullname" . }}-role
subjects:
- kind: ServiceAccount
  name: {{ include "kmortem.serviceAccountName" . }}
  namespace: {{ include "kmortem.namespace" . }}
