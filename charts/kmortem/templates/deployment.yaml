---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kmortem.fullname" . }}-manager
  namespace: {{ include "kmortem.namespace" . }}
  labels:
    {{- include "kmortem.labels" . | nindent 4 }}
    control-plane: manager
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "kmortem.selectorLabels" . | nindent 6 }}
      control-plane: manager
  template:
    metadata:
      labels:
        {{- include "kmortem.selectorLabels" . | nindent 8 }}
        control-plane: manager
    spec:
      serviceAccountName: {{ include "kmortem.serviceAccountName" . }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- range . }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
      containers:
      - name: manager
        image: {{ include "kmortem.image" . }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        args:
        - --leader-elect={{ .Values.leaderElection.enabled }}
        - --leader-election-namespace={{ include "kmortem.leaderElectionNamespace" . }}
        - --metrics-bind-address=:8080
        - --health-probe-bind-address=:8081
        env:
        - name: KMORTEM_RETENTION_TTL
          value: {{ .Values.retentionTTL | quote }}
        ports:
        - containerPort: 8080
          name: metrics
          protocol: TCP
        - containerPort: 8081
          name: health
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
