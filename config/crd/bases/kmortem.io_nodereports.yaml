---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.14.0
  name: nodereports.kmortem.io
spec:
  group: kmortem.io
  names:
    kind: NodeReport
    listKind: NodeReportList
    plural: nodereports
    shortNames:
    - nr
    singular: nodereport
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.nodeName
      name: Node
      type: string
    - jsonPath: .spec.terminationCause
      name: Cause
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: NodeReport is the Schema for the nodereports API.
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            description: NodeReportSpec defines the desired state of NodeReport.
            properties:
              archival:
                description: Archival holds archival information.
                properties:
                  archivedAt:
                    format: date-time
                    type: string
                  bucket:
                    type: string
                  enabled:
                    type: boolean
                  key:
                    type: string
                type: object
              conditionHistory:
                description: ConditionHistory is the history of node conditions.
                items:
                  properties:
                    lastTransitionTime:
                      format: date-time
                      type: string
                    message:
                      type: string
                    reason:
                      type: string
                    status:
                      type: string
                    type:
                      type: string
                  type: object
                type: array
              initiatedBy:
                description: InitiatedBy describes who or what triggered the drain.
                type: string
              instanceMetadata:
                description: InstanceMetadata holds AWS instance information.
                properties:
                  availabilityZone:
                    type: string
                  instanceID:
                    type: string
                  instanceType:
                    type: string
                  lifecycle:
                    enum:
                    - spot
                    - on-demand
                    type: string
                  region:
                    type: string
                type: object
              nodeName:
                description: NodeName is the name of the terminated node.
                type: string
              nodeMetadata:
                description: NodeMetadata holds Kubernetes node system information.
                properties:
                  allocatableCPU:
                    type: string
                  allocatableMemory:
                    type: string
                  containerRuntime:
                    type: string
                  kernelVersion:
                    type: string
                  kubeletVersion:
                    type: string
                  osImage:
                    type: string
                type: object
              nodeUID:
                description: NodeUID is the UID of the node, used for deduplication.
                type: string
              oomKills:
                description: OOMKills is the list of OOMKill events on the node.
                items:
                  properties:
                    containerName:
                      type: string
                    memoryLimit:
                      type: string
                    namespace:
                      type: string
                    podName:
                      type: string
                    timestamp:
                      format: date-time
                      type: string
                  type: object
                type: array
              pdbViolations:
                description: PDBViolations is the list of PDB violations during drain.
                items:
                  properties:
                    namespace:
                      type: string
                    pdbName:
                      type: string
                    reason:
                      type: string
                  type: object
                type: array
              pods:
                description: Pods is the list of pods that were on the node.
                items:
                  properties:
                    endTime:
                      format: date-time
                      type: string
                    exitReason:
                      enum:
                      - Evicted
                      - Completed
                      - OOMKilled
                      - Error
                      - Unknown
                      type: string
                    name:
                      type: string
                    namespace:
                      type: string
                    ownerKind:
                      enum:
                      - Deployment
                      - StatefulSet
                      - DaemonSet
                      - Job
                      - CronJob
                      - None
                      type: string
                    ownerName:
                      type: string
                    phase:
                      type: string
                    startTime:
                      format: date-time
                      type: string
                  type: object
                type: array
              terminationCause:
                description: TerminationCause classifies why the node was terminated.
                enum:
                - SpotInterruption
                - ClusterAutoscalerScaleDown
                - ManualDrain
                - NodeConditionFailure
                - CloudMaintenanceEvent
                - Unknown
                type: string
              terminationTime:
                description: TerminationTime is when the node termination was detected.
                format: date-time
                type: string
            type: object
          status:
            description: NodeReportStatus defines the observed state of NodeReport.
            properties:
              archiveFailureCount:
                description: ArchiveFailureCount tracks how many times archival has been attempted.
                type: integer
              collectionCompletedAt:
                description: CollectionCompletedAt is when evidence collection finished.
                format: date-time
                type: string
              conditions:
                description: Conditions are detailed status conditions.
                items:
                  properties:
                    lastTransitionTime:
                      format: date-time
                      type: string
                    message:
                      type: string
                    reason:
                      type: string
                    status:
                      type: string
                    type:
                      type: string
                  type: object
                type: array
              message:
                description: Message is a human-readable status message.
                type: string
              phase:
                description: Phase is the current lifecycle phase of the NodeReport.
                enum:
                - Collecting
                - Complete
                - PendingDeletion
                - Archived
                - ArchiveFailed
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
