name: Version Bump

on:
  pull_request:
    types:
      - labeled
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  bump:
    name: Bump Chart version
    # Only run when the added label is one of the release labels.
    if: |
      contains(github.event.pull_request.labels.*.name, 'release:major') ||
      contains(github.event.pull_request.labels.*.name, 'release:minor') ||
      contains(github.event.pull_request.labels.*.name, 'release:patch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.WORKFLOW_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Determine bump type
        id: bump
        env:
          LABELS: ${{ toJson(github.event.pull_request.labels.*.name) }}
        run: |
          if echo "$LABELS" | grep -q 'release:major'; then
            echo "type=major" >> "$GITHUB_OUTPUT"
          elif echo "$LABELS" | grep -q 'release:minor'; then
            echo "type=minor" >> "$GITHUB_OUTPUT"
          else
            echo "type=patch" >> "$GITHUB_OUTPUT"
          fi

      - name: Calculate next version
        id: version
        run: |
          LATEST=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
          LATEST=${LATEST:-v0.0.0}
          VERSION=${LATEST#v}
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MINOR=$(echo "$VERSION" | cut -d. -f2)
          PATCH=$(echo "$VERSION" | cut -d. -f3)
          case "$BUMP_TYPE" in
            major) MAJOR=$((MAJOR+1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR+1)); PATCH=0 ;;
            patch) PATCH=$((PATCH+1)) ;;
          esac
          echo "new=${MAJOR}.${MINOR}.${PATCH}" >> "$GITHUB_OUTPUT"
        env:
          BUMP_TYPE: ${{ steps.bump.outputs.type }}

      - name: Update Chart.yaml
        env:
          NEW_VERSION: ${{ steps.version.outputs.new }}
        run: |
          sed -i "s/^version:.*/version: ${NEW_VERSION}/" charts/kmortem/Chart.yaml
          sed -i "s/^appVersion:.*/appVersion: \"v${NEW_VERSION}\"/" charts/kmortem/Chart.yaml

      - name: Commit and push
        env:
          NEW_VERSION: ${{ steps.version.outputs.new }}
          HAS_WORKFLOW_TOKEN: ${{ secrets.WORKFLOW_TOKEN != '' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add charts/kmortem/Chart.yaml
          git diff --staged --exit-code && echo "Chart.yaml already up to date" && exit 0
          git commit -m "chore: bump chart version to ${NEW_VERSION}"
          git push
          if [ "$HAS_WORKFLOW_TOKEN" != "true" ]; then
            echo "::warning::WORKFLOW_TOKEN secret is not set. The version-bump commit will not trigger CI. Set a PAT with contents:write and workflows:write scopes as WORKFLOW_TOKEN to fix this."
          fi
